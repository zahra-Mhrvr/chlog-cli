[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chlog-cli"
version = "0.1.0"
description = "Generate a CHANGELOG.md from your git history, grouped by conventional commit type."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
dependencies = [
    "click>=8.1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/chlog-cli"

[project.scripts]
chlog = "chlog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
